[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "iptv-auto-next"
version = "0.1.0"
description = "Automated IPv4 IPTV source collection, validation, and subscription publishing."
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "aiohttp>=3.12,<4",
    "jsonschema>=4.25,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.14,<1",
]

[project.scripts]
iptv-auto-next = "iptv_auto_next.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
